name: Debug Builds

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android Workloads
        run: |
          dotnet workload install android maui-android

      - name: Build Android APK
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-android \
            -p:TargetFrameworks=net9.0-android \
            -c Debug \
            -p:AndroidPackageFormat=apk \
            -o ./publish-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Debug
          path: ./publish-android/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (Debug)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install iOS Workload
        run: |
          dotnet workload install ios maui

      - name: Build iOS IPA
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-ios \
            -p:TargetFrameworks=net9.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackageDir="./publish-ios"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Debug
          path: ./publish-ios/*.ipa
          if-no-files-found: error

  # ============================================================
  # NEW: macOS (Mac Catalyst) — produces a .app bundle
  # ============================================================
  build-maccatalyst:
    name: Build macOS App (Debug)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install Mac Catalyst Workload
        run: |
          dotnet workload install maccatalyst maui

      - name: Build Mac Catalyst App
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-maccatalyst \
            -p:TargetFrameworks=net9.0-maccatalyst \
            -c Debug \
            -p:RuntimeIdentifier=maccatalyst-x64 \
            -p:EnableCodeSigning=false \
            -p:CreatePackage=false \
            -o ./publish-maccatalyst

      # Universal binary (Intel + Apple Silicon). Uncomment if you want
      # a single .app that runs natively on both architectures.
      # - name: Build Mac Catalyst App (Universal)
      #   run: |
      #     dotnet publish ./BookViewer.Maui.csproj \
      #       -f net9.0-maccatalyst \
      #       -p:TargetFrameworks=net9.0-maccatalyst \
      #       -c Debug \
      #       -p:RuntimeIdentifiers="maccatalyst-x64;maccatalyst-arm64" \
      #       -p:EnableCodeSigning=false \
      #       -o ./publish-maccatalyst

      - name: Zip .app Bundle
        run: |
          cd ./publish-maccatalyst
          # Find the .app (its name matches the app display name)
          APP=$(find . -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            ls -la
            exit 1
          fi
          echo "Zipping: $APP"
          zip -r -y "BookViewer-macOS-Debug.zip" "$APP"
          ls -la

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-Debug
          path: ./publish-maccatalyst/BookViewer-macOS-Debug.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows App (Debug)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        shell: pwsh
        run: |
          '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' | Out-File -Encoding utf8 global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: Build Windows App
        run: |
          dotnet publish ./BookViewer.Maui.csproj `
            -f net9.0-windows10.0.19041.0 `
            -p:TargetFrameworks=net9.0-windows10.0.19041.0 `
            -c Debug `
            -p:RuntimeIdentifierOverride=win10-x64 `
            -p:WindowsPackageType=None `
            -p:GenerateAppInstallerFile=false `
            -o ./publish-windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App-Debug
          path: ./publish-windows/**
          if-no-files-found: error
